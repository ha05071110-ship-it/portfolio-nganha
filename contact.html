<!-- CONTACT -->
<!-- CONTACT -->
<section class="contact-section">

  <!-- LEFT -->
  <div class="contact-left">
    <h1>Get in touch</h1>
    <p>Looking forward to hearing from you</p>

    <div class="contact-info">
      <h3>Email</h3>
      <p>nganha@email.com</p>
    </div>

<div class="contact-social">

  <a href="https://www.linkedin.com/in/nganhathi" target="_blank">
    <i class="fab fa-linkedin"></i>
  </a>

  <a href="https://www.facebook.com/ngan.ha.525478" target="_blank">
    <i class="fab fa-facebook"></i>
  </a>

</div>

    <a href="https://drive.google.com/file/d/1hJuLwUsh8E95gnRmuF9yDI1DDzI4aBoW/view?usp=sharing" class="cv-btn">
      Download CV
    </a>
  </div> <!-- ✅ ĐÓNG LEFT Ở ĐÂY -->

  <!-- RIGHT -->
  <div class="contact-right">
    <form id="contactForm">

      <div class="row">
        <div class="input-group">
          <label>First Name</label>
          <input type="text" id="firstName">
          <small class="error"></small>
        </div>

        <div class="input-group">
          <label>Last Name</label>
          <input type="text" id="lastName">
          <small class="error"></small>
        </div>
      </div>

      <div class="input-group">
        <label>Email *</label>
        <input type="text" id="email">
        <small class="error"></small>
      </div>

      <div class="input-group">
        <label>Message</label>
        <textarea id="message"></textarea>
      </div>

      <button type="submit" class="submit-btn">Send</button>

    </form>
  </div>

</section>

<!-- ✅ MODAL để ngoài -->
<div class="success-overlay" id="successModal">
  <div class="success-box">
    <h3>Gửi thành công 🎉</h3>
    <p>Mình đã nhận được tin nhắn của bạn. Mình sẽ phản hồi sớm nhất có thể!</p>
    <button type="button" id="closeBtn">Đóng</button>
  </div>
</div>

</section>

</div>

  </div>
